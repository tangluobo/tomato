name: Release AOT Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version, for example v1.0.2'
        required: true
        type: string
      release_name:
        description: 'Release display name'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft?'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Additional release notes (markdown)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            arch: x86_64
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            nfpm_arch: amd64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            nfpm_arch: arm64
            appimage_arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出项目
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 设置 GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-job-reports: 'true'

      - name: 解析并核对版本
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(mvn --batch-mode --no-transfer-progress -Dstyle.color=never help:evaluate \
            -Dexpression=project.version -q -DforceStdout)
          EXPECTED_VERSION=${REQUESTED_VERSION#v}
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "POM version $VERSION does not match requested release $EXPECTED_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          java --version
          native-image --version

      - name: 安装 Linux 打包工具
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libgtk-3-dev libx11-dev \
            libxtst-dev libxrender-dev libxi-dev libasound2-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo curl --fail --location --retry 3 \
            --output /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool

      - name: 安装 Windows 打包工具
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }
          choco install nsis --version=3.12.0 -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }

      - name: 编译并归档 Windows AOT
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress clean package -Pnative-direct -DskipTests `
            "-Dnative.package.os=${{ matrix.platform }}" `
            "-Dnative.package.arch=${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 编译并归档 Unix AOT
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress clean package -Pnative-direct -DskipTests \
            -Dnative.package.os=${{ matrix.platform }} \
            -Dnative.package.arch=${{ matrix.arch }}

      - name: 生成 Windows AOT 安装包
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./packaging/windows/package-aot.ps1 -Version $env:VERSION -Architecture '${{ matrix.arch }}'

      - name: 生成 Linux AOT 安装包
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/linux/package-aot.sh "$VERSION" '${{ matrix.arch }}' \
            '${{ matrix.nfpm_arch }}' '${{ matrix.appimage_arch }}'

      - name: 生成 macOS AOT 安装包
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/package-aot.sh "$VERSION" '${{ matrix.arch }}'

      - name: 验证 Windows 产物
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $base = "dist/tomato-$env:VERSION-${{ matrix.platform }}-${{ matrix.arch }}"
          @('.zip', '.tar.gz', '.exe', '.msi') | ForEach-Object {
            $file = "$base$_"
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing artifact: $file" }
            Get-Item -LiteralPath $file | Select-Object Name, Length
          }

      - name: 验证 Linux 产物
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          base="dist/tomato-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          for suffix in .zip .tar.gz .deb .rpm .AppImage; do
            test -s "${base}${suffix}" || { echo "Missing artifact: ${base}${suffix}" >&2; exit 1; }
          done
          ls -lh dist/

      - name: 验证 macOS 产物
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          base="dist/tomato-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          for suffix in .zip .tar.gz .dmg .pkg; do
            test -s "${base}${suffix}" || { echo "Missing artifact: ${base}${suffix}" >&2; exit 1; }
          done
          ls -lh dist/

      - name: 上传平台产物
        uses: actions/upload-artifact@v4
        with:
          name: tomato-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 检出项目
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 展平产物并计算 SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_files
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -e "release_files/$name" ]; then
              echo "Duplicate release artifact: $name" >&2
              exit 1
            fi
            cp "$file" "release_files/$name"
          done < <(find artifacts -type f -print0)
          (cd release_files && sha256sum * > SHA256SUMS.txt)

      - name: 生成 Release 信息
        id: release_info
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          VERSION=${RAW_VERSION#v}
          TAG="v${VERSION}"
          NAME=${INPUT_RELEASE_NAME:-$TAG}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 生成 Release 说明
        shell: bash
        env:
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          cat > release_body.md << BODYEOF
          ## Tomato ${{ steps.release_info.outputs.version }}

          所有发行包均由各目标平台上的 GraalVM Native Image AOT 程序生成。

          | 平台 | 架构 | 格式 |
          |------|------|------|
          | Windows | x86_64 | ZIP / tar.gz / EXE / MSI |
          | Linux | x86_64 | ZIP / tar.gz / DEB / RPM / AppImage |
          | Linux | arm64 | ZIP / tar.gz / DEB / RPM / AppImage |
          | macOS | x86_64 | ZIP / tar.gz / DMG / PKG |
          | macOS | arm64 | ZIP / tar.gz / DMG / PKG |

          - Commit: ${{ steps.release_info.outputs.commit }}
          - Build date: ${{ steps.release_info.outputs.build_date }}
          - GraalVM JDK: 25

          每个压缩包都包含 AOT 主程序及其运行所需的同目录动态库。文件校验值见 `SHA256SUMS.txt`。

          ${EXTRA_NOTES}
          BODYEOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body_path: release_body.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: release_files/*
